<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LightCraft · Mac</title><link rel="stylesheet" href="/view.css"><script defer src="/view.js"></script></head>
<body>
<header><strong>LightCraft</strong><span class="session">Mac</span><span id="status" role="status">Connexion au Mac…</span><nav><button id="actions" type="button">Actions</button><button id="share" type="button">Copier le lien</button><button id="fullscreen" type="button">Plein écran</button></nav></header>
<main id="stage"><canvas id="view" tabindex="0" aria-label="Vue LightCraft du Mac. Cliquez pour piloter la photothèque et les retouches."></canvas><div id="notice"><p id="message">Connexion à LightCraft…</p><button id="retry" type="button">Reconnecter</button></div></main>
<section id="commands" hidden><div class="commands-head"><input id="search" type="search" placeholder="Rechercher une action…" aria-label="Rechercher une action"><button id="close-actions" type="button">Fermer</button></div><div id="command-list"></div></section>
<input id="share-link" hidden readonly aria-label="Lien de connexion à cette session">
</body></html>
